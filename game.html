<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="is-game-page">

  <header class="nav">
    <a href="index.html" class="nav__logo">🎮 <span class="nav__logo-word">Goki</span></a>
    <span class="nav__game-title" id="game-title"></span>
    <button class="btn-help" id="help-btn" title="Steuerung anzeigen">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 1 1 3.6 2.2c-.9.5-1.1.9-1.1 1.7"/><circle cx="12" cy="16.7" r=".4" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn-login">Login</button>
  </header>

  <div class="game-layout">
    <aside class="sidebar">
      <p class="sidebar__label">Vorgeschlagen</p>
      <div id="suggested-left" class="sidebar__list"></div>
    </aside>

    <div class="game-center">
      <div class="game-loading" id="game-loading">
        <div class="spinner"></div>
      </div>
      <iframe id="game-frame" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <aside class="sidebar sidebar--right">
      <p class="sidebar__label">Mehr Spiele</p>
      <div id="suggested-right" class="sidebar__list"></div>
    </aside>
  </div>

  <div class="bottom-row">
    <p class="sidebar__label">Das könnte dir auch gefallen</p>
    <div id="suggested-bottom" class="bottom-row__grid"></div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
