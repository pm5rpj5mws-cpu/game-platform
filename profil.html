<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Highscores – Goki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="nav__logo">🎮 Goki</a>
    <span class="nav__game-title">Meine Highscores</span>
    <button class="btn-login">Login</button>
  </header>

  <section class="hero">
    <h1>Meine Highscores</h1>
    <p>Deine Bestleistungen aus allen Spielen an einem Ort.</p>
    <p class="profile-who" id="profile-who"></p>
    <button type="button" class="btn-danger-outline" id="delete-account-btn" style="display:none;">Konto löschen</button>
  </section>

  <main>
    <section id="profile-section">
      <div id="profile-grid" class="game-grid game-grid--featured"></div>
    </section>

    <section id="leaderboard-section" style="display:none;">
      <h2 class="section-title">Globale Bestenlisten</h2>
      <div id="leaderboard-grid" class="leaderboard-grid"></div>
    </section>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/profil.js"></script>
</body>
</html>
