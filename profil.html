<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Highscores – Goki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="nav__logo">🎮 <span class="nav__logo-word">Goki</span></a>
    <span class="nav__game-title">Meine Highscores</span>
    <button class="btn-login">Login</button>
  </header>

  <section class="hero">
    <h1>Meine Highscores</h1>
    <p>Deine Bestleistungen aus allen Spielen an einem Ort.</p>
    <p class="profile-who" id="profile-who"></p>
    <button type="button" class="btn-danger-outline" id="delete-account-btn" style="display:none;">Konto löschen</button>
  </section>

  <main>
    <div class="stat-row" id="stat-row">
      <div class="stat">
        <div class="stat__icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 13l2.5 2.5L16 9.5"/></svg>
        </div>
        <div><div class="stat__value" id="stat-scored">–</div><div class="stat__label">Spiele mit eigenem Score</div></div>
      </div>
      <div class="stat">
        <div class="stat__icon gold">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z" stroke-linejoin="round"/></svg>
        </div>
        <div><div class="stat__value" id="stat-best-rank">–</div><div class="stat__label" id="stat-best-rank-label">Beste Top-5-Platzierung</div></div>
      </div>
      <div class="stat">
        <div class="stat__icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M12 19V4M20 19v-6"/></svg>
        </div>
        <div><div class="stat__value" id="stat-medals">0</div><div class="stat__label">Medaillen gesammelt</div></div>
      </div>
    </div>

    <section id="profile-section">
      <div id="profile-grid" class="game-grid game-grid--featured"></div>
    </section>

    <section id="leaderboard-section" style="display:none;">
      <h2 class="section-title">Globale Bestenlisten</h2>
      <div id="leaderboard-grid" class="leaderboard-grid"></div>
    </section>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/profil.js"></script>
</body>
</html>
