services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://goki:goki@postgres:5432/goki
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goki
      POSTGRES_PASSWORD: goki
      POSTGRES_DB: goki
    volumes:
      - goki_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goki"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  goki_pg_data:
