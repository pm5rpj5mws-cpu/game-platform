services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-goki}:${POSTGRES_PASSWORD:-goki}@postgres:5432/${POSTGRES_DB:-goki}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goki}
      POSTGRES_DB: ${POSTGRES_DB:-goki}
    volumes:
      - goki_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goki}"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  goki_pg_data:
